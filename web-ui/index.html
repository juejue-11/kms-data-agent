<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB 缺陷分析助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="1" y="1" width="30" height="30" rx="7" fill="#C7A45C"/>
                    <g stroke="#0C2038" stroke-width="2" stroke-linecap="round" fill="none">
                        <path d="M8 16 H14 V10 H18"/>
                        <path d="M8 22 H12 V24 H20"/>
                        <path d="M24 16 H20 V22 H24"/>
                    </g>
                    <g fill="#0C2038">
                        <circle cx="8" cy="16" r="2.6"/>
                        <circle cx="18" cy="10" r="2.6"/>
                        <circle cx="8" cy="22" r="2.6"/>
                        <circle cx="20" cy="24" r="2.6"/>
                        <circle cx="24" cy="16" r="2.6"/>
                        <circle cx="24" cy="22" r="2.6"/>
                    </g>
                </svg>
                <div class="brand-text">
                    <div class="brand-name">PCB 缺陷分析</div>
                    <div class="brand-sub">质量工程助手</div>
                </div>
            </div>

            <nav class="nav" aria-label="功能">
                <div class="nav-label">功能</div>
                <button id="new-session-btn" class="nav-item nav-button" type="button">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                        <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>
                <!-- 列表由服务端返回的本人会话生成，切换时从 Pi 历史恢复消息。 -->
                <div class="session-heading">
                    <span>我的会话</span>
                    <button id="refresh-sessions-btn" class="icon-button" type="button" aria-label="刷新会话列表" title="刷新">↻</button>
                </div>
                <div id="session-list" class="session-list" role="list" aria-label="会话列表"></div>
            </nav>

            <div class="sidebar-foot">
                <div class="status">
                    <span id="connection-dot" class="status-dot"></span>
                    <div class="status-text">
                        <div id="connection-title" class="status-title">正在连接服务</div>
                        <div id="connection-desc" class="status-desc">会话状态加载中</div>
                    </div>
                </div>
                <div class="version">内部工具 · 会话版</div>
            </div>
        </aside>

        <!-- 主区 -->
        <main class="main">
            <header class="topbar">
                <div>
                    <div id="session-title" class="topbar-title">缺陷定位对话</div>
                    <div id="run-status" class="run-status" aria-live="polite"></div>
                </div>
                <div class="topbar-sub">依据知识库与联网检索结果作答，并标注出处</div>
            </header>

            <div id="chat-box" class="chat-box">
                <div id="welcome-message" class="message ai-message">
                    <div class="avatar ai">助</div>
                    <div class="bubble">
                        <div class="msg-text">你好，我是 PCB 缺陷分析助手。请描述你遇到的异常现象（例如「线路上有开路/短路」「焊盘有绿油残留」），我会帮你定位缺陷类型并标注判定依据。</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="user-input" rows="1" placeholder="描述异常现象，Enter 发送，Shift+Enter 换行"></textarea>
                <!-- 仅在存在当前请求时显示；停止动作通过请求 ID 定位，不影响其他会话。 -->
                <button id="stop-btn" class="stop-btn" type="button" hidden>停止</button>
                <button id="send-btn" type="button">发送</button>
            </div>
        </main>
    </div>
    <!-- 两种会话操作复用弹窗样式，由 showModal 锁定背景和键盘焦点。 -->
    <dialog id="session-rename-dialog" class="session-dialog" aria-labelledby="session-rename-heading">
        <form id="session-rename-form" class="session-dialog-content">
            <h2 id="session-rename-heading">重命名会话</h2>
            <label class="session-title-label" for="session-rename-input">会话标题（最多100个字符）</label>
            <input id="session-rename-input" class="session-title-input" type="text" autocomplete="off" aria-describedby="session-rename-error" autofocus>
            <p id="session-rename-error" class="session-dialog-error" role="alert"></p>
            <div class="session-dialog-actions">
                <button id="session-rename-cancel" class="dialog-button dialog-button-secondary" type="button">取消</button>
                <button id="session-rename-save" class="dialog-button dialog-button-primary" type="submit">保存</button>
            </div>
        </form>
    </dialog>
    <dialog id="session-delete-dialog" class="session-dialog" aria-labelledby="session-delete-heading" aria-describedby="session-delete-message">
        <div class="session-dialog-content">
            <h2 id="session-delete-heading">删除会话</h2>
            <p id="session-delete-message">删除会话及其关联消息后不可恢复。</p>
            <div class="session-dialog-actions">
                <button id="session-delete-cancel" class="dialog-button dialog-button-secondary" type="button">取消</button>
                <button id="session-delete-confirm" class="dialog-button dialog-button-danger" type="button">确认删除</button>
            </div>
        </div>
    </dialog>
    <script src="vendor/marked.umd.js"></script>
    <script src="js/markdown.js"></script>
    <!-- 先加载 HTTP/SSE 客户端，再初始化页面控制器；Markdown 渲染器独立复用。 -->
    <script src="js/client.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
