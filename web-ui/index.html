<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB 缺陷分析助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                    <rect x="1" y="1" width="30" height="30" rx="7" fill="#C7A45C"/>
                    <g stroke="#0C2038" stroke-width="2" stroke-linecap="round" fill="none">
                        <path d="M8 16 H14 V10 H18"/>
                        <path d="M8 22 H12 V24 H20"/>
                        <path d="M24 16 H20 V22 H24"/>
                    </g>
                    <g fill="#0C2038">
                        <circle cx="8" cy="16" r="2.6"/>
                        <circle cx="18" cy="10" r="2.6"/>
                        <circle cx="8" cy="22" r="2.6"/>
                        <circle cx="20" cy="24" r="2.6"/>
                        <circle cx="24" cy="16" r="2.6"/>
                        <circle cx="24" cy="22" r="2.6"/>
                    </g>
                </svg>
                <div class="brand-text">
                    <div class="brand-name">PCB 缺陷分析</div>
                    <div class="brand-sub">质量工程助手</div>
                </div>
            </div>

            <nav class="nav">
                <div class="nav-label">功能</div>
                <a class="nav-item active" href="#">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                        <path d="M3 4h14v8H8l-5 4z" fill="currentColor"/>
                    </svg>
                    <span>缺陷定位</span>
                </a>
            </nav>

            <div class="sidebar-foot">
                <div class="status">
                    <span class="status-dot"></span>
                    <div class="status-text">
                        <div class="status-title">知识库已接入</div>
                        <div class="status-desc">RAGFlow 语义检索</div>
                    </div>
                </div>
                <div class="version">内部工具 · v1.0</div>
            </div>
        </aside>

        <!-- 主区 -->
        <main class="main">
            <header class="topbar">
                <div class="topbar-title">缺陷定位对话</div>
                <div class="topbar-sub">依据知识库与联网检索结果作答，并标注出处</div>
            </header>

            <div id="chat-box" class="chat-box">
                <div class="message ai-message">
                    <div class="avatar ai">助</div>
                    <div class="bubble">
                        <div class="msg-text">你好，我是 PCB 缺陷分析助手。请描述你遇到的异常现象（例如「线路上有开路/短路」「焊盘有绿油残留」），我会帮你定位缺陷类型并标注判定依据。</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="user-input" rows="1" placeholder="描述异常现象，Enter 发送，Shift+Enter 换行"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </main>
    </div>
    <script src="vendor/marked.umd.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
